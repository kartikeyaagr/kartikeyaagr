    <text x="30" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#d4d0c8" text-anchor="start" >engineering roles</text>
