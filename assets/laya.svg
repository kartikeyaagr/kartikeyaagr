<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 380" width="576" height="380" role="img" aria-label="fast-laya-compaction: Claude Code compaction that keeps every message verbatim and trims stale tool output instead, decided by a 421M-parameter classifier running locally. 27 to 33% smaller on real sessions.">
  <defs><clipPath id="card"><rect x="6" y="3.5" width="564" height="373.0" rx="24"/></clipPath></defs>
  <g clip-path="url(#card)">
    <rect x="6" y="3.5" width="564" height="373.0" fill="#111317"/>

    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#e6e8ec" text-anchor="start" >fast-laya-compaction</text><text x="30" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >keeps the conversation verbatim</text>
    <rect x="24" y="111" width="528" height="34" rx="6" fill="#181b21"/><text x="36" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >user</text><text x="134" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#e6e8ec" text-anchor="start" >login test fails after refresh</text><rect x="24" y="150" width="528" height="34" rx="6" fill="#181b21"/><text x="36" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >tool</text><g><text x="134" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >Read auth.ts</text>
      <animate attributeName="opacity" to="0.35" begin="1.5s" dur="0.3s" fill="freeze"/></g>
    <line x1="132" y1="168" x2="132" y2="168" stroke="#5b8cff" stroke-width="2">
      <animate attributeName="x2" from="132" to="292" begin="1.0s" dur="0.5s" fill="freeze"/></line>
    <g opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/><text x="540" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#5b8cff" text-anchor="end" >dropped</text></g><rect x="24" y="189" width="528" height="34" rx="6" fill="#181b21"/><text x="36" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >tool</text><g><text x="134" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >Grep token · 88 hits</text>
      <animate attributeName="opacity" to="0.35" begin="2.1s" dur="0.3s" fill="freeze"/></g>
    <line x1="132" y1="207" x2="132" y2="207" stroke="#5b8cff" stroke-width="2">
      <animate attributeName="x2" from="132" to="398" begin="1.6s" dur="0.5s" fill="freeze"/></line>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.1s" fill="freeze"/><text x="540" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#5b8cff" text-anchor="end" >dropped</text></g><rect x="24" y="228" width="528" height="34" rx="6" fill="#181b21"/><text x="36" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#5b8cff" text-anchor="start" >claude</text><text x="134" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#e6e8ec" text-anchor="start" >expiry check in refresh()</text><rect x="24" y="267" width="528" height="34" rx="6" fill="#181b21"/><text x="36" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >tool</text><g><text x="134" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >npm test · 2k lines</text>
      <animate attributeName="opacity" to="0.35" begin="2.7s" dur="0.3s" fill="freeze"/></g>
    <line x1="132" y1="285" x2="132" y2="285" stroke="#5b8cff" stroke-width="2">
      <animate attributeName="x2" from="132" to="385" begin="2.2s" dur="0.5s" fill="freeze"/></line>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.7s" fill="freeze"/><text x="540" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#5b8cff" text-anchor="end" >truncated</text></g>
    <text x="30" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="normal" fill="#5b8cff" text-anchor="start" >27–33% smaller</text>
    <text x="546" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="end" >421M local model</text>
  </g>
  <rect x="6.5" y="4.0" width="563" height="372.0" rx="24" fill="none" stroke="#22262e"/>
</svg>
