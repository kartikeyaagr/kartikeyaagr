<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 340" width="576" height="340" role="img" aria-label="FinePrint: a Chrome extension that finds a site's Terms &amp; Conditions and Privacy Policy and gives a plain-English summary with a 1-10 security score, flagging 10 red-flag patterns such as forced arbitration, data sale and auto-renewal.">
  <defs><clipPath id="card"><rect x="6" y="3.5" width="564" height="333.0" rx="24"/></clipPath></defs>
  <g clip-path="url(#card)">
    <rect x="6" y="3.5" width="564" height="333.0" fill="#111317"/>

    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#e6e8ec" text-anchor="start" >FinePrint</text><text x="30" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >a nutrition label for Terms &amp; Conditions</text>
    <text x="546" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#5d6470" text-anchor="end" >chrome extension</text>
    <rect x="34" y="118" width="214" height="190" rx="10" fill="#181b21" stroke="#22262e"/>
    <rect x="52" y="144" width="167" height="6" rx="3" fill="#323844"/><rect x="52" y="160" width="144" height="6" rx="3" fill="#323844"/><rect x="52" y="176" width="175" height="6" rx="3" fill="#323844"/><rect x="48" y="171" width="0" height="16" rx="4" fill="#5b8cff" opacity="0.35">
      <animate attributeName="width" from="0" to="183" begin="0.6s" dur="0.4s" fill="freeze"/></rect>
    <circle cx="234" cy="179" r="5" fill="#5b8cff" opacity="0">
      <set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/></circle><rect x="52" y="192" width="150" height="6" rx="3" fill="#323844"/><rect x="52" y="208" width="172" height="6" rx="3" fill="#323844"/><rect x="52" y="224" width="175" height="6" rx="3" fill="#323844"/><rect x="48" y="219" width="0" height="16" rx="4" fill="#5b8cff" opacity="0.35">
      <animate attributeName="width" from="0" to="183" begin="1.2s" dur="0.4s" fill="freeze"/></rect>
    <circle cx="234" cy="227" r="5" fill="#5b8cff" opacity="0">
      <set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/></circle><rect x="52" y="240" width="169" height="6" rx="3" fill="#323844"/><rect x="52" y="256" width="161" height="6" rx="3" fill="#323844"/><rect x="52" y="272" width="129" height="6" rx="3" fill="#323844"/><rect x="48" y="267" width="0" height="16" rx="4" fill="#5b8cff" opacity="0.35">
      <animate attributeName="width" from="0" to="137" begin="1.8s" dur="0.4s" fill="freeze"/></rect>
    <circle cx="234" cy="275" r="5" fill="#5b8cff" opacity="0">
      <set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/></circle><rect x="52" y="288" width="157" height="6" rx="3" fill="#323844"/>
    <text x="290" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="normal" fill="#5b8cff" text-anchor="start" >10</text>
    <text x="360" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >red-flag</text>
    <text x="360" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >patterns</text>
    <text x="290" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#e6e8ec" text-anchor="start" >• arbitration</text><text x="290" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >• data sale</text><text x="290" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="normal" fill="#8b93a1" text-anchor="start" >• auto-renewal</text>
  </g>
  <rect x="6.5" y="4.0" width="563" height="332.0" rx="24" fill="none" stroke="#22262e"/>
</svg>
