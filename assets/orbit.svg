<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 380" width="384" height="380" role="img" aria-label="I benchmark it before I believe it.">
  <defs><clipPath id="card"><rect x="6" y="3.5" width="372" height="373.0" rx="24"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient></defs>
  <g clip-path="url(#card)">
    <rect x="6" y="3.5" width="372" height="373.0" fill="#111317"/>

    <circle cx="192" cy="152" r="170" fill="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="192" cy="152" r="44" fill="none" stroke="#22262e"/><circle cx="192" cy="152" r="78" fill="none" stroke="#22262e"/><circle cx="192" cy="152" r="112" fill="none" stroke="#22262e"/>
    <circle cx="192" cy="152" r="11" fill="#5b8cff"/>
    <g><circle cx="270" cy="152" r="6" fill="#5b8cff"/>
      <animateTransform attributeName="transform" type="rotate" from="0 192 152" to="360 192 152" dur="20s" repeatCount="indefinite"/></g>
    <g><circle cx="192" cy="40" r="4" fill="#e6e8ec" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="360 192 152" to="0 192 152" dur="36s" repeatCount="indefinite"/></g>
    <text x="192" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#5b8cff" text-anchor="middle" font-style="italic">I benchmark it</text>
    <text x="192" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#5b8cff" text-anchor="middle" font-style="italic">before I believe it.</text>
  </g>
  <rect x="6.5" y="4.0" width="371" height="372.0" rx="24" fill="none" stroke="#22262e"/>
</svg>
