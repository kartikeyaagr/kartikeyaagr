<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 380" width="384" height="380" role="img" aria-label="SmartRoute: an LLM inference router plus the harness that tests whether routing pays. On 200 everyday queries, always-cheap matched routed accuracy at about a quarter of the cost.">
  <defs><clipPath id="card"><rect x="6" y="3.5" width="372" height="373.0" rx="24"/></clipPath></defs>
  <g clip-path="url(#card)">
    <rect x="6" y="3.5" width="372" height="373.0" fill="#121212"/>

    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#d4d0c8" text-anchor="start" >SmartRoute</text><text x="30" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#888880" text-anchor="start" >LLM inference router + its own test</text>
    <path d="M74,186 C156,186 160,138 242,138" fill="none" stroke="#e8684a" stroke-width="2.5"/><path d="M74,186 C156,186 160,186 242,186" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M74,186 C156,186 160,234 242,234" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="250" cy="138" r="7" fill="#e8684a" stroke="#e8684a"/><text x="266" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#d4d0c8" text-anchor="start" >cheap</text><circle cx="250" cy="186" r="7" fill="#2a2a2a" stroke="#444"/><text x="266" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#888880" text-anchor="start" >middle</text><circle cx="250" cy="234" r="7" fill="#2a2a2a" stroke="#444"/><text x="266" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#888880" text-anchor="start" >frontier</text>
    <circle cx="66" cy="186" r="8" fill="#d4d0c8"/>
    <text x="66" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#888880" text-anchor="middle" >query</text>
    <circle r="5" fill="#e8684a"><animateMotion path="M74,186 C156,186 160,138 242,138" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="30" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#888880" text-anchor="start" >on 200 everyday queries,</text>
    <text x="30" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#e8684a" text-anchor="start" >~¼ the cost</text>
    <text x="30" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#888880" text-anchor="start" >always-cheap matched routed accuracy</text>
  </g>
  <rect x="6.5" y="4.0" width="371" height="372.0" rx="24" fill="none" stroke="#222"/>
</svg>
